# KernelGen Configuration File
# 统一配置文件，控制所有生成和评估参数
# 支持原始Agent系统和LangChain系统

# 数据集配置
dataset:
  source: "huggingface"  # huggingface 或 local
  name: "ScalingIntelligence/KernelBench"
  level: 2  # 1, 2, 3, 4
  problem_ids: [40, 41, 42]  # 指定问题ID，空列表表示所有问题

# 生成配置
generation:
  max_iterations: 20  # 最大迭代次数
  early_stop_threshold: 1.2  # 加速比阈值，达到后提前停止
  min_successful_iterations: 3  # 最少成功迭代次数
  backend: "triton"  # triton, cuda
  
  # LLM配置
  llm:
    server_type: "deepseek"
    model_name: "deepseek-coder"
    temperature: 0.0
    max_tokens: 4096

# LangChain特定配置
langchain:
  # 链配置
  chains:
    analysis:
      max_retries: 3
      timeout: 60
    generation:
      max_retries: 3
      timeout: 120
    validation:
      max_retries: 2
      timeout: 30
  
  # 内存配置
  memory:
    type: "buffer_window"  # buffer_window, conversation_summary
    k: 5  # 保持最近k轮对话
    return_messages: true
    
# 性能测试配置
performance:
  device: "cuda"
  warmup_runs: 10
  benchmark_runs: 100
  timeout: 180  # 超时时间（秒）
  
# 输出配置
output:
  base_dir: "runs"  # 基础输出目录
  run_name: "kernelgen_run"  # 运行名称
  save_all_kernels: true  # 保存所有生成的kernel
  save_best_only: false  # 仅保存最佳kernel
  save_logs: true
  save_performance_data: true

# 评估配置
evaluation:
  num_correct_trials: 5  # 正确性测试次数
  num_perf_trials: 100   # 性能测试次数
  pass_at_k_values: [1, 5, 10]  # pass@k计算的k值
  
# 并发配置
concurrency:
  num_workers: 4  # 并发worker数量
  api_query_interval: 0.1  # API查询间隔（秒）

# 多worker搜索配置
multi_worker_search:
  # Worker配置
  num_workers: 4                    # 并行worker数量
  max_rounds: 10                    # 最大搜索轮次
  
  # 阈值配置
  thresholds:
    UB: 0.8                        # 上界阈值（写入经验池）
    LB: 0.3                        # 下界阈值（人工干预）
    DT: 0.3                        # 退化阈值（人工干预）
  
  # 策略选择配置
  strategy_selection:
    warmup_random: true            # 预热阶段随机选择
    top_k_ratio: 0.5              # Top-K策略比例
    knowledge_base_weight: 0.3     # 知识库推荐权重
  
  # 经验池配置
  experience_pool:
    max_size: 100                  # 最大经验数量
    fusion_probability: 0.1        # 融合概率
  
  # 知识库配置
  knowledge_base:
    persistence_path: "runs/knowledge_base.pkl"
    min_samples_for_recommendation: 3
    quality_score_weights:
      alpha: 0.5                   # 方差惩罚权重
      beta: 0.5                    # 成功率权重
      gamma: 0.1                   # 覆盖范围权重
  
  # 资源管理
  resource_management:
    worker_timeout: 180            # Worker超时时间（秒）
    max_retries: 1                 # 最大重试次数
    enable_gpu_memory_management: true