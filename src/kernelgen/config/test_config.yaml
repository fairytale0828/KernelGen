# KernelGen 测试配置文件

# 迭代测试配置
iterative_test:
  max_iterations: 20
  output_dir: "test_results"
  save_kernels: true
  save_detailed_logs: true

# 性能测试配置
performance_test:
  warmup_runs: 10
  benchmark_runs: 50
  test_shapes:
    matmul:
      - [512, 512, 512]    # M, K, N
      - [1024, 1024, 1024]
      - [2048, 2048, 2048]
    relu:
      - [1024, 512]        # batch_size, dim
      - [2048, 1024]
      - [4096, 2048]
  dtype: "float32"
  device: "cuda"

# Agent配置
agent_config:
  docs_dir:
    designer: "resources/docs"
    coder: "resources/docs"
  agent_model_config:
    designer: "deepseek_default"
    coder: "deepseek_coder"
    conductor: "deepseek_default"
    default: "deepseek_default"

# PyTorch算子模板
pytorch_templates:
  matmul: |
    import torch
    import torch.nn as nn

    class Model(nn.Module):
        """矩阵乘法模型"""
        def __init__(self):
            super(Model, self).__init__()

        def forward(self, a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
            """
            计算矩阵乘法 C = A @ B
            Args:
                a: 输入矩阵A，形状为 [M, K]
                b: 输入矩阵B，形状为 [K, N]
            Returns:
                输出矩阵C，形状为 [M, N]
            """
            return torch.matmul(a, b)

    # 测试参数
    M, K, N = 1024, 1024, 1024

    def get_inputs():
        a = torch.randn(M, K, dtype=torch.float32)
        b = torch.randn(K, N, dtype=torch.float32)
        return [a, b]

    def get_init_inputs():
        return []

  relu: |
    import torch
    import torch.nn as nn

    class Model(nn.Module):
        """ReLU激活函数模型"""
        def __init__(self):
            super(Model, self).__init__()

        def forward(self, x: torch.Tensor) -> torch.Tensor:
            """
            计算ReLU激活函数
            Args:
                x: 输入张量
            Returns:
                ReLU激活后的张量
            """
            return torch.relu(x)

    batch_size = 16
    dim = 16384

    def get_inputs():
        x = torch.randn(batch_size, dim, dtype=torch.float32)
        return [x]

    def get_init_inputs():
        return []

# 迭代反馈策略
iteration_feedback:
  strategies:
    - ""  # 第一次无反馈
    - "请优化内存访问模式，考虑使用更大的block size"
    - "请重点优化计算密集型操作，使用向量化指令"
    - "请考虑使用共享内存来减少全局内存访问"
    - "请优化线程块的配置，平衡并行度和资源使用"
    - "请考虑使用不同的数据布局来提高缓存命中率"
    - "请优化循环展开和指令级并行"
    - "请考虑使用更激进的优化策略"
    - "请重点关注寄存器使用效率"
    - "请优化warp级别的协作模式"